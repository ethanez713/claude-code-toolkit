name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: grok-handoff (fake Grok)
        working-directory: skills/grok-handoff
        run: python -m unittest discover -s tests -t .
      - name: self-improve
        working-directory: skills/self-improve/scripts
        run: python test_harvest.py && python test_write_tests_hook.py
